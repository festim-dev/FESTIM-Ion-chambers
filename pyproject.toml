[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ion_chambers"
version = "0.1.0"
description = "FESTIM model of a tritium ionisation chamber"
requires-python = ">=3.12"
# festim, dolfinx and friends come from conda-forge: see environment.yml

[tool.setuptools]
packages = ["ion_chambers"]
